<!doctype html>
<html lang="ru">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Страница не найдена — Спецтехника Минск</title>
		<meta name="robots" content="noindex, follow" />
		<meta name="theme-color" content="#fcdd76" />
		<link rel="icon" href="images/favicon.ico" sizes="32x32" />
		<link rel="icon" href="images/favicon.svg" type="image/svg+xml" />
		<style>
			* {
				box-sizing: border-box;
				margin: 0;
				padding: 0;
			}
			body {
				display: flex;
				min-height: 100dvh;
				align-items: center;
				justify-content: center;
				padding: 24px;
				font-family: Arial, Helvetica, sans-serif;
				color: #000;
				background: #fcdd76;
				text-align: center;
			}
			.box {
				max-width: 560px;
			}
			.code {
				font-size: 96px;
				font-weight: 700;
				line-height: 1;
			}
			h1 {
				margin: 12px 0;
				font-size: 26px;
				font-weight: 600;
			}
			p {
				margin-bottom: 24px;
				font-size: 17px;
				line-height: 1.4;
			}
			.actions {
				display: flex;
				gap: 12px;
				flex-wrap: wrap;
				justify-content: center;
			}
			a {
				display: inline-block;
				padding: 14px 24px;
				font-size: 17px;
				color: #000;
				text-decoration: none;
				background: #fff;
				border-radius: 12px;
			}
			a.ghost {
				background: transparent;
				border: 2px solid #000;
			}
			a:focus-visible {
				outline: 3px solid #000;
				outline-offset: 2px;
			}
		</style>
	</head>
	<body>
		<div class="box">
			<div class="code">404</div>
			<h1>Такой страницы нет</h1>
			<p>
				Возможно, ссылка устарела. Перейдите на главную или позвоните —
				подскажем по технике и ценам.
			</p>
			<div class="actions">
				<a href="./">На главную</a>
				<a href="tel:+375440000000" class="ghost">+375 44 000-00-00</a>
			</div>
		</div>
	</body>
</html>
